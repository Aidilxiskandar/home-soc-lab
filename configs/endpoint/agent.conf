<!--
  Centralised agent config for Wazuh group: linux-victims
  Applies to: soc-victim-01 (Ubuntu Server 24.04 LTS, arm64), Wazuh agent 4.14.9

  WHERE IT GOES (manager side, done by the wazuh branch):
    /var/ossec/etc/shared/linux-victims/agent.conf  inside the wazuh.manager container
    (that path lives in the persistent wazuh_etc volume). See configs/endpoint/README.md.

  WHAT IT ADDS ON TOP OF THE AGENT'S DEFAULT ossec.conf:
    1. auditd log collection. Auth events (sshd, sudo, useradd, cron) come from the
       agent's default journald input, used by Phase 2 simulations
       01 ssh-brute-force, 02 local-account-creation, 05 sudo-abuse.
    2. File integrity monitoring (FIM) with who-data on persistence and account files,
       used by 02, 03 cron-persistence and 04 sensitive-file-tampering.

  AGENT PREREQUISITES (on the VM, see docs/endpoints.md):
    - auditd installed and running, needed for whodata="yes" and audit.log

  Validate on the manager before agents pull it:
    /var/ossec/bin/verify-agent-conf -f /var/ossec/etc/shared/linux-victims/agent.conf
-->
<agent_config os="Linux">

  <!-- ================= 1. Log collection ================= -->
  <!-- sshd, sudo, PAM, useradd and cron messages come from the systemd journal,
       which the agent's DEFAULT ossec.conf already reads
       (<log_format>journald</log_format>). Do not add /var/log/auth.log or
       /var/log/syslog here: on the first build that made every event arrive
       twice (once per source, same second). Decision 2026-11-04, see
       docs/endpoints.md "Decisions".
       Phase 2 check: sshd failures from journald must still carry srcip
       (rules 5710/5760). If they don't, switch back to auth.log here AND
       remove the journald block from the VM's local ossec.conf. -->

  <!-- auditd log: not in the journal, so read the file. Lets Phase 3 rules see
       execve/sudo detail if needed later -->

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- ================= 2. File integrity monitoring ================= -->
  <syscheck>
    <disabled>no</disabled>
    <scan_on_start>yes</scan_on_start>
    <!-- Full scheduled scan every 12 h; who-data paths alert within seconds anyway -->
    <frequency>43200</frequency>

    <!-- Wide net: anything under /etc, with who-data (which user and process
         made the change). No report_changes here on purpose: /etc also holds
         private keys and network secrets, and diffs would copy them into alerts. -->
    <directories check_all="yes" whodata="yes">/etc</directories>

    <!-- Narrow net: account, sudo and cron files, WITH content diffs.
         The most specific path wins, so these settings override the /etc line.
         T1136.001 / T1548.003 / T1053.003 / T1565.001 -->
    <directories check_all="yes" whodata="yes" report_changes="yes">/etc/passwd,/etc/group,/etc/sudoers,/etc/sudoers.d</directories>
    <directories check_all="yes" whodata="yes" report_changes="yes">/etc/crontab,/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/etc/cron.weekly,/etc/cron.monthly</directories>

    <!-- shadow/gshadow: alert on any change (who, when, hash of file),
         but NEVER store a diff, since that would put password hashes in the SIEM. -->
    <directories check_all="yes" whodata="yes">/etc/shadow,/etc/gshadow</directories>
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>

    <!-- Per-user crontabs (crontab -e) live in /var/spool/cron/crontabs on Ubuntu -->
    <directories check_all="yes" whodata="yes" report_changes="yes">/var/spool/cron</directories>

    <!-- Optional, off for now: SSH key persistence (T1098.004). Uncomment if wanted.
    <directories check_all="yes" whodata="yes" report_changes="yes">/root/.ssh,/home/labuser/.ssh</directories>
    -->

    <!-- Noise that changes on its own -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/ld.so.cache</ignore>
    <ignore type="sregex">.swp$|~$</ignore>

    <!-- Lock files that useradd/userdel/passwd create and delete in a second
         (about 14 low-level FIM alerts per account change in sim 02). Exact
         paths on purpose: a pattern like ^/etc/[a-z]+\.lock$ would also hide
         an attacker's file named e.g. /etc/evil.lock.
         NOT ignored: the backups passwd- shadow- group- gshadow- subuid- subgid-,
         which are useful evidence (they hold the state before the change). -->
    <ignore>/etc/passwd.lock</ignore>
    <ignore>/etc/shadow.lock</ignore>
    <ignore>/etc/group.lock</ignore>
    <ignore>/etc/gshadow.lock</ignore>
    <ignore>/etc/subuid.lock</ignore>
    <ignore>/etc/subgid.lock</ignore>
    <ignore>/etc/.pwd.lock</ignore>

    <!-- If auditd is missing or who-data fails, the agent falls back to
         realtime (inotify) for these paths and logs a warning in
         /var/ossec/logs/ossec.log. That still alerts in seconds, just without
         the user/process fields. -->
  </syscheck>

</agent_config>
