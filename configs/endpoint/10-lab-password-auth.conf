# /etc/ssh/sshd_config.d/10-lab-password-auth.conf
# LAB ONLY: soc-victim-01. Do not copy this to any real server.
#
# Turns SSH password login ON so simulation 01 (ssh-brute-force, T1110.001)
# has something to attack. Password login on an internet-facing host is how
# real brute-force compromises start.
#
# Why "10-": sshd uses the FIRST value it reads for each setting, and files in
# sshd_config.d are read in name order. Ubuntu/cloud-init may create
# 50-cloud-init.conf with "PasswordAuthentication no"; a 10- file is read first.
# Check the result with: sudo sshd -T | grep -Ei 'passwordauth|permitroot|maxauth'

PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
# Default is 6. Keep it, so the brute force produces several failures per connection.
MaxAuthTries 6

# No AllowUsers/AllowGroups on purpose: a wrong name there locks the admin
# account out of SSH. The VM is only reachable from the Mac (UTM NAT), root
# login is off, and the admin account uses a strong, unique password.
